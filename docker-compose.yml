services:
  redis:
    image: redis:7-alpine
    container_name: rate-limit-redis
    ports:
      - "6379:6379"

  nginx-proxy:
    image: nginx:alpine
    container_name: rate-limit-nginx
    ports:
      - "8001:8001"
      - "8002:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - redis

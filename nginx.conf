events {}

http {
    upstream spring_gateway {
        # Trỏ vào Spring Cloud Gateway đang chạy ở port 8080 trên máy thật (Host)
        server host.docker.internal:8080;
    }

    # CASE 1: CỔNG 8001 - LỖ HỔNG (Không xóa XFF, nối thêm IP giả của client)
    server {
        listen 8001;
        location / {
            proxy_pass http://spring_gateway;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }
    }

    # CASE 2: CỔNG 8002 - AN TOÀN (Xóa sạch header client, ghi đè IP socket thật)
    server {
        listen 8002;
        location / {
            proxy_pass http://spring_gateway;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
        }
    }
}
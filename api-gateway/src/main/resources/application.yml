server:
  port: 8080

spring:
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      routes:
        - id: ticket-service
          uri: http://localhost:8081        # khi có Eureka/LoadBalancer: lb://ticket-service
          predicates:
            - Path=/api/tickets/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1     # nạp 1 token mỗi giây
                redis-rate-limiter.burstCapacity: 10    # xô chứa tối đa 10 token
                redis-rate-limiter.requestedTokens: 1   # mỗi request tốn 1 token
                key-resolver: "#{@ipKeyResolver}"        # request này của ai?
